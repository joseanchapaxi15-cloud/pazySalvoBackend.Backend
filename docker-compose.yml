services:
  postgres:
    image: postgres:17-alpine
    container_name: paz-salvo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pazysalvo
      POSTGRES_USER: pazysalvo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-esta-clave}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - paz_salvo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pazysalvo -d pazysalvo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/pazysalvo
      DB_USER: pazysalvo
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-esta-clave}
      UPLOAD_DIR: /app/uploads
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@institucion.gob.ec}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-talento.humano}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-Administrador de Talento Humano}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-talento.humano@institucion.gob.ec}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-cambiar-esta-clave-inicial}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - paz_salvo_uploads:/app/uploads

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - api

volumes:
  paz_salvo_data:
  paz_salvo_uploads:
