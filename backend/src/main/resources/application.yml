server:
  port: ${PORT:8081}
  servlet:
    context-path: /api
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: strict

spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pazysalvo}
    username: ${DB_USER:pazysalvo}
    password: ${DB_PASSWORD:cambiar-esta-clave}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 32MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  mail-from: ${MAIL_FROM:no-reply@institucion.gob.ec}
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8088,http://127.0.0.1:8088}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:talento.humano}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Administrador de Talento Humano}
    email: ${BOOTSTRAP_ADMIN_EMAIL:talento.humano@institucion.gob.ec}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:cambiar-esta-clave-inicial}
